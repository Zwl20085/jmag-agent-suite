name: tests
on: [push, pull_request]
jobs:
  offline:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: worker stays Python 3.8 compatible
        run: |
          pip install vermin
          vermin --target=3.8- --violations --no-tips src/jmag_bridge/worker
