[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jmag-mcp-bridge"
version = "0.1.0"
description = "MCP server + Claude skills that let AI agents drive JMAG-Designer FEA with engineering feedback"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.10"]
keywords = ["jmag", "fea", "electric-machines", "mcp", "claude", "agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
jmag-mcp = "jmag_bridge.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jmag_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a licensed local JMAG-Designer (run with -m live)"]
addopts = "-m 'not live'"
